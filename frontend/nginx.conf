server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Uploads (bank files, receipt photos): the app enforces its own limit
    # (Settings → Storage, up to 100 MB); this only stops anything larger
    client_max_body_size 101m;

    # Paths the Django backend owns: the API, receipt images, sign-in (single
    # sign-on under /oidc, or the admin's password login) and the admin's
    # CSS/JS. When the app runs on its own this is how they reach it; behind
    # Traefik, /api, /media and /oidc go straight to the backend instead.
    location ~ ^/(api|media|oidc|admin|static)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Bank imports and backups can take a while
        proxy_read_timeout 300s;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React Router owns every other path
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        # Limits what the page may load to this site itself: code only from
        # this site's own files (never written into the page, so injected
        # text can't run), connections only to this server, no framing by
        # other sites. Enforced since 2026-11, after report-only use showed
        # nothing it would block.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
