# Runs the checks on every pull request and every change to main, and before
# a release is built (release.yml calls it). A pull request shows a tick or a
# cross from these.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # as in backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # A throwaway SQLite database: no PostgreSQL needed
      - run: python manage.py test finance --settings=config.settings_test

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'       # as in frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build

  scripts:
    name: Scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in scripts/*.sh backend/entrypoint.sh; do bash -n "$f"; done
