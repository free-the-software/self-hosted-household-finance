# Builds and publishes the app's images when a version is tagged:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# After the tests pass, each image is published to GitHub's container
# registry as ghcr.io/<owner>/<repo>/<image>, tagged 1.2.0, 1.2 and latest,
# with the version built in (shown in Settings). Installs made from a release
# (docker-compose.release.yml) download these instead of building.
name: Release images

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  images:
    name: Image ${{ matrix.image }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend          # also runs the watcher and the scheduler
            context: backend
            platforms: linux/amd64,linux/arm64
          - image: frontend
            context: frontend
            platforms: linux/amd64,linux/arm64
          # The optional receipt reader: 64-bit x86 only for now (its machine
          # learning libraries are large, and ARM is untested)
          - image: receipt-reader
            context: ai_worker
            platforms: linux/amd64
            # Large and slow to build, and rarely changed: when ai_worker/ is
            # the same as at the previous release, that release's image is
            # given the new version's tags instead of being built again. (The
            # version isn't built into this image, so nothing in it changes.)
            reuse_when_unchanged: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the tags and history, to compare with the previous release

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Unchanged since the previous release?
        id: reuse
        if: matrix.reuse_when_unchanged
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          FOLDER: ${{ matrix.context }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ] && git diff --quiet "$previous" "$GITHUB_REF_NAME" -- "$FOLDER" \
             && docker buildx imagetools inspect "$IMAGE:${previous#v}" >/dev/null 2>&1; then
            echo "$FOLDER is unchanged since $previous: reusing its image."
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "from=$IMAGE:${previous#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Building: ${previous:-no previous release} differs, or its image isn't there."
          fi

      - name: Give the existing image the new version
        if: steps.reuse.outputs.reuse == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          FROM_IMAGE: ${{ steps.reuse.outputs.from }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$FROM_IMAGE"

      - uses: docker/build-push-action@v7
        if: steps.reuse.outputs.reuse != 'true'
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
