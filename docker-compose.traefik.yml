# ==========================================================
# TRAEFIK ADD-ON: serve the app through a Traefik reverse proxy
# ----------------------------------------------------------
# Layered on top of docker-compose.yaml. Turn it on with this line in .env:
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.traefik.yml
#
# Needs: a running Traefik on the external Docker network "traefik_default",
# an "https" and an "http" entrypoint, a certificate resolver named
# "cloudflare" (change below if yours differs), and DOMAIN_NAME in .env.
# The app's own port (8080) is not published in this mode.
# ==========================================================

services:
  backend:
    labels:
      - "traefik.enable=true"

      # 1. ROUTER
      # Everything Django owns: the API, receipt images and the OIDC
      # login/callback under /oidc. The Django admin is deliberately not
      # routed: it is a password login that would bypass single sign-on.
      - "traefik.http.routers.finance-backend.rule=Host(`${DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/media`) || PathPrefix(`/oidc`))"
      - "traefik.http.routers.finance-backend.priority=100"
      - "traefik.http.routers.finance-backend.entrypoints=https"
      - "traefik.http.routers.finance-backend.tls=true"
      - "traefik.http.routers.finance-backend.tls.certresolver=cloudflare"

      # 2. AUTH
      # No Traefik auth middleware: Django requires an Authentik (OIDC)
      # session for every /api and /media request.

      # 3. SERVICE
      - "traefik.http.routers.finance-backend.service=finance-django-svc"
      - "traefik.http.services.finance-django-svc.loadbalancer.server.port=8000"

      # 4. NETWORK
      - "traefik.docker.network=traefik_default"
    networks:
      - traefik_default
      - default

  frontend:
    # Reached through Traefik only
    ports: !reset []
    labels:
      - "traefik.enable=true"

      # 1. HTTPS ROUTER
      - "traefik.http.routers.finance-frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.finance-frontend.entrypoints=https"
      - "traefik.http.routers.finance-frontend.tls=true"
      - "traefik.http.routers.finance-frontend.tls.certresolver=cloudflare"

      # 2. HTTP TO HTTPS REDIRECT
      - "traefik.http.routers.finance-frontend-http.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.finance-frontend-http.entrypoints=http"
      - "traefik.http.routers.finance-frontend-http.middlewares=secure-redirect"
      - "traefik.http.middlewares.secure-redirect.redirectscheme.scheme=https"

      # 3. SERVICE & NETWORK
      - "traefik.http.services.finance-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_default"
    networks:
      - traefik_default
      - default

networks:
  traefik_default:
    external: true
